[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference"
version = "0.1.0"
description = "Minimal, high-performance LLM inference engine built from scratch in pure PyTorch."
readme = "README.md"
authors = [
    { name = "Shehab Ashraf" }
]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.4.0",
    "tokenizers>=0.20.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
bench = [
    "transformers==5.6.2",       # HF reference models in bench/ppl.py only
    "datasets==5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "huggingface_hub>=1.0",      # `hf` CLI: model downloads (setup tooling)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
