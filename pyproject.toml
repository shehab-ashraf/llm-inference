[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference"
version = "0.1.0"
description = "LLM inference engine"
readme = "README.md"
requires-python = "==3.11.15"
dependencies = [
    "torch==2.8.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "transformers==5.6.2",
    "datasets==5.0.0",
    "huggingface_hub[cli]==1.24.0",
    "click==8.4.2"
]

[tool.setuptools.packages.find]
where = ["src"]
