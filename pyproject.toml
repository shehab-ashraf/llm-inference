[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference"
version = "0.1.0"
description = "Minimal, high-performance LLM inference engine built from scratch in pure PyTorch."
readme = "README.md"
authors = [
    { name = "Shehab Ashraf" }
]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.11.0,<2.12",                      
    "tokenizers>=0.20.0",
    "safetensors>=0.4.0",
    "flash-attn>=2.8.3.post1; sys_platform == 'linux'",  
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
flash-attn = [{ index = "astral-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128/"
explicit = true

[project.optional-dependencies]
bench = [
    "transformers==5.6.2",       # HF reference models in bench/ppl.py only
    "datasets==5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "huggingface_hub>=1.0",      # `hf` CLI: model downloads (setup tooling)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
